name: Package Android signing tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-signing-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and package Android Build Tools 35
        shell: bash
        run: |
          sdkmanager 'build-tools;35.0.0'
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          cp -L "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib64/libc++.so" signing-tools/lib64/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-signing-with-libcxx
          path: signing-tools
          if-no-files-found: error
          retention-days: 1
