name: Build Sol & Sahara POS 1.0.3

on:
  push:
    branches: [main]
    paths:
      - 'ci/pos101.tar.xz.part*'
      - 'ci/pos103-exact-receipt.patch.xz.b64.part*'
      - '.github/workflows/build-pos-1.0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out build inputs
        uses: actions/checkout@v4

      - name: Reassemble and verify exact 1.0.1 source
        shell: bash
        run: |
          cat ci/pos101.tar.xz.part* > /tmp/pos101.tar.xz
          echo 'bdc1ef46eac75ebc2d3c0acb2d6753a00f35db919166ba6554c29b01386e725b  /tmp/pos101.tar.xz' | sha256sum -c -
          tar -xJf /tmp/pos101.tar.xz

      - name: Reassemble and apply 1.0.3 receipt patch
        shell: bash
        run: |
          cat ci/pos103-exact-receipt.patch.xz.b64.part* \
            | tr -d '\r\n' \
            | base64 --decode \
            | xz --decompress > /tmp/pos103-receipt.patch
          echo '9393934b4a0409f6714093f78f89c233377ee3d1a0db894463753fca178428b4  /tmp/pos103-receipt.patch' | sha256sum -c -
          git apply --check /tmp/pos103-receipt.patch
          git apply /tmp/pos103-receipt.patch
          grep -F 'versionCode = 4' android/app/build.gradle.kts
          grep -F 'versionName = "1.0.3"' android/app/build.gradle.kts
          grep -F 'suspend fun sendReceipt' android/app/src/main/java/com/solandsahara/pos/data/BridgeApi.kt
          grep -F 'Text("SEND RECEIPT")' android/app/src/main/java/com/solandsahara/pos/ui/PosApp.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build release APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p android testReleaseUnitTest assembleRelease

      - name: Verify build output
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: sol-sahara-pos-1.0.3-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
