name: Build Sol & Sahara POS 1.0.3

on:
  push:
    branches: [main]
    paths:
      - 'ci/pos101.tar.xz.part*'
      - 'ci/patch-pos-1.0.2.py'
      - 'ci/patch-pos-1.0.3.py'
      - '.github/workflows/build-pos-1.0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out build inputs
        uses: actions/checkout@v4

      - name: Reassemble and verify 1.0.1 source
        shell: bash
        run: |
          cat ci/pos101.tar.xz.part* > /tmp/pos101.tar.xz
          echo 'bdc1ef46eac75ebc2d3c0acb2d6753a00f35db919166ba6554c29b01386e725b  /tmp/pos101.tar.xz' | sha256sum -c -
          tar -xJf /tmp/pos101.tar.xz

      - name: Apply 1.0.2 payment binding fix
        shell: bash
        run: python3 ci/patch-pos-1.0.2.py

      - name: Diagnose and apply 1.0.3 email receipt feature
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          models = Path('android/app/src/main/java/com/solandsahara/pos/model/Models.kt').read_text()
          start = models.index('data class Sale(')
          end = models.index('data class PosSettings(')
          print('SALE_MODEL_REPR=', repr(models[start:end]))
          health = models.index('data class BridgeHealth(')
          print('HEALTH_MODEL_REPR=', repr(models[health:health + 700]))
          patch = Path('ci/patch-pos-1.0.3.py').read_text()
          marker = "val serverTimeUnix: Long? = null,"
          around = patch.index(marker)
          print('PATCH_PATTERN_REPR=', repr(patch[around - 80:around + 250]))
          PY
          python3 ci/patch-pos-1.0.3.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build release APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p android testReleaseUnitTest assembleRelease

      - name: Verify build output
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: sol-sahara-pos-1.0.3-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
